services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sage_index}
      POSTGRES_USER: ${POSTGRES_USER:-sage_index}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - sage-index

  backend:
    build:
      context: ./backend
    image: sage-index/backend:1.0.0
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sageindeex-postgres-1:5432/${POSTGRES_DB:-sage_index}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sage_index}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:?PORTAL_ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TRACEABILITY_DB_PASSWORD: ${TRACEABILITY_DB_PASSWORD:?TRACEABILITY_DB_PASSWORD is required}
      HR_DB_PASSWORD: ${HR_DB_PASSWORD:?HR_DB_PASSWORD is required}
      PLANNING_DB_URL: ${PLANNING_DB_URL:-jdbc:postgresql://gestion-planning-postgres:5432/plannings}
      PLANNING_DB_USERNAME: ${PLANNING_DB_USERNAME:-postgres}
      PLANNING_DB_PASSWORD: ${PLANNING_DB_PASSWORD:?PLANNING_DB_PASSWORD is required}
      PLANNING_APP_URL: ${PLANNING_APP_URL:-http://localhost:3000/}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "8081:8080"
    networks:
      - sage-index
      - traceability-network
      - rh-network
      - planning-network

  frontend:
    build:
      context: ./frontend
    image: sage-index/frontend:1.0.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - sage-index

volumes:
  postgres_data:

networks:
  sage-index:
  traceability-network:
    external: true
    name: traceabilitystore_app-network
  rh-network:
    external: true
    name: rh_default
  planning-network:
    external: true
    name: gestionplanning_default
