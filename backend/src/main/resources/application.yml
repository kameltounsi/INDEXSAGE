spring:
  application:
    name: sage-index-unified-portal
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sage_index}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sage_index}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

portal:
  admin:
    password: ${PORTAL_ADMIN_PASSWORD}
