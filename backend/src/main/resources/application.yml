spring:
  application:
    name: sage-index-unified-portal
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sage_index}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sage_index}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

portal:
  assistant:
    ollama:
      enabled: ${OLLAMA_ENABLED:true}
      url: ${OLLAMA_URL:http://host.docker.internal:11434}
      model: ${OLLAMA_MODEL:qwen3:8b}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-sol}
  applications:
    traceability-url: ${TRACEABILITY_APP_URL:http://localhost:5173/}
    hr-url: ${HR_APP_URL:http://localhost:5170/}
    planning-url: ${PLANNING_APP_URL:http://localhost:3000/}
  admin:
    password: ${PORTAL_ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    lifetime-seconds: 28800
  sources:
    traceability:
      url: ${TRACEABILITY_DB_URL:jdbc:postgresql://storepostgres:5432/store}
      username: ${TRACEABILITY_DB_USERNAME:postgres}
      password: ${TRACEABILITY_DB_PASSWORD}
    hr:
      url: ${HR_DB_URL:jdbc:postgresql://rh-postgresql-1:5432/rh}
      username: ${HR_DB_USERNAME:postgres}
      password: ${HR_DB_PASSWORD}
    planning:
      url: ${PLANNING_DB_URL:jdbc:postgresql://gestion-planning-postgres:5432/plannings}
      username: ${PLANNING_DB_USERNAME:postgres}
      password: ${PLANNING_DB_PASSWORD}
